name: CI

on:
  push:
  pull_request:

jobs:
  contracts:
    name: Contract tests (Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-git
      - name: Build
        run: forge build --sizes
      - name: Test (unit + 1,000-run fuzz)
        run: forge test -vv

  mcp:
    name: MCP server end-to-end
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build contract
        run: forge install foundry-rs/forge-std --no-git && forge build
      - name: Install
        working-directory: mcp
        run: npm ci
      - name: Test against a local chain
        working-directory: mcp
        run: npm test
